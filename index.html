<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#111827">
  <title>C.Ludo — لودوی سه‌بعدی</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="menu" class="screen active">
    <div class="menu-glow"></div>
    <div class="brand">
      <div class="brand-cube"><span>C</span></div>
      <h1>C.Ludo</h1>
      <p>لـودوی سه‌بعدی آفلاین</p>
    </div>

    <div class="menu-card">
      <button class="main-btn" id="playBtn"><span>▶</span> شروع بازی</button>
      <button class="menu-btn" id="howBtn">❔ آموزش بازی</button>
      <button class="menu-btn" id="settingsBtn">⚙ تنظیمات</button>
      <button class="menu-btn" id="aboutBtn">◆ درباره C.Ludo</button>
    </div>
    <div class="version">C.Ludo • Offline Edition</div>
  </div>

  <div id="setup" class="screen">
    <div class="panel">
      <button class="back" data-back="menu">‹</button>
      <h2>راه‌اندازی مسابقه</h2>
      <p class="sub">بازیکنان و حالت بازی را انتخاب کن</p>

      <label>تعداد بازیکنان</label>
      <div class="seg" id="playerCount">
        <button data-n="2" class="selected">۲</button>
        <button data-n="3">۳</button>
        <button data-n="4">۴</button>
      </div>

      <label>حالت بازی</label>
      <div class="mode-grid">
        <button class="mode selected" data-mode="local"><b>👥</b><span>چند نفره محلی</span><small>روی یک دستگاه</small></button>
        <button class="mode" data-mode="bot"><b>🤖</b><span>بازی با هوش مصنوعی</span><small>آفلاین</small></button>
      </div>

      <label>نام بازیکنان</label>
      <div id="names"></div>

      <button class="main-btn" id="startBtn">🎮 ساخت مسابقه</button>
    </div>
  </div>

  <div id="game" class="screen">
    <header class="game-head">
      <div class="turn-pill"><i id="turnDot"></i><span id="turnName">قرمز</span></div>
      <div class="game-title">C.Ludo</div>
      <button class="icon-btn" id="exitBtn">×</button>
    </header>

    <main class="table-wrap">
      <section class="board-area">
        <div id="board" class="board">
          <div class="base red-base"><div class="base-title">قرمز</div><div class="yard" id="yard-red"></div></div>
          <div class="base green-base"><div class="base-title">سبز</div><div class="yard" id="yard-green"></div></div>
          <div class="base yellow-base"><div class="base-title">زرد</div><div class="yard" id="yard-yellow"></div></div>
          <div class="base blue-base"><div class="base-title">آبی</div><div class="yard" id="yard-blue"></div></div>
          <div class="track" id="track"></div>
          <div class="center"><div class="center-star">★</div></div>
          <div class="tokens" id="tokens"></div>
        </div>
      </section>

      <section class="controls">
        <div class="status" id="status">برای شروع تاس را بزن</div>
        <button id="diceBtn" class="dice-wrap" aria-label="پرتاب تاس">
          <div id="dice" class="dice">
            <span class="pip p1"></span><span class="pip p2"></span><span class="pip p3"></span>
            <span class="pip p4"></span><span class="pip p5"></span><span class="pip p6"></span>
          </div>
        </button>
        <div class="dice-label">پرتاب تاس</div>
      </section>
    </main>

    <div class="bottom-bar">
      <button id="soundBtn">🔊 صدا</button>
      <div class="mini-info"><span id="rollInfo">تاس: —</span><span id="safeInfo">خانه امن: فعال</span></div>
      <button id="restartBtn">↻ بازی جدید</button>
    </div>
  </div>

  <div id="modal" class="modal">
    <div class="modal-card">
      <h2 id="modalTitle">عنوان</h2>
      <div id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <div id="toast"></div>
</div>
<script src="game.js"></script>
</body>
</html>
