<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>C.Ludo</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1020">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="splash">
  <h1>C.LUDO</h1>
  <div class="bar"><i></i></div>
  <small>v1.0</small>
</div>

<div id="hud" hidden>
  <span id="turn"></span>
  <button id="pause">☰</button>
</div>

<div id="board-wrap" hidden>
  <canvas id="c"></canvas>

  <div id="dock">

    <div
      class="scene"
      role="button"
      tabindex="0"
      aria-label="Roll dice"
      onclick="document.getElementById('roll').click()"
      onkeydown="if(event.key==='Enter'||event.key===' '){document.getElementById('roll').click()}"
    >
      <div class="cube" id="cube">
        <b class="f f1">⚀</b>
        <b class="f f2">⚁</b>
        <b class="f f3">⚂</b>
        <b class="f f4">⚃</b>
        <b class="f f5">⚄</b>
        <b class="f f6">⚅</b>
      </div>
    </div>

    <!-- Hidden compatibility button: JS can still use #roll -->
    <button
      id="roll"
      class="btn"
      tabindex="-1"
      aria-hidden="true"
    ></button>

  </div>
</div>

<div id="ui"></div>

<script src="js/engine.js"></script>
<script src="js/app.js"></script>

</body>
</html>
